namespace: todo

config:
  DB_HOST: postgres-service
  DB_PORT: "5432"
  DB_NAME: todo

backend:
  replicaCount: 1

  image:
    repository: alihanural/todo-backend
    tag: latest
    pullPolicy: IfNotPresent

  containerPort: 8000

  service:
    port: 8000
    targetPort: 8000

frontend:
  replicaCount: 1

  image:
    repository: alihanural/todo-frontend
    tag: latest
    pullPolicy: IfNotPresent

  containerPort: 80

  service:
    type: NodePort
    port: 80
    targetPort: 80
    nodePort: 30080

postgres:
  replicaCount: 1

  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent

  containerPort: 5432

  service:
    port: 5432
    targetPort: 5432

  persistence:
    accessMode: ReadWriteOnce
    size: 1Gi
    reclaimPolicy: Retain
    hostPath: /data/postgres

  credentials:
    username: todo_user
    password: todo_password