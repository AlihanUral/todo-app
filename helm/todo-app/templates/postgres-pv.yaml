apiVersion: v1
kind: PersistentVolume

metadata:
  name: postgres-pv

spec:
  capacity:
    storage: {{ .Values.postgres.persistence.size }}

  accessModes:
    - {{ .Values.postgres.persistence.accessMode }}

  persistentVolumeReclaimPolicy: {{ .Values.postgres.persistence.reclaimPolicy }}

  hostPath:
    path: {{ .Values.postgres.persistence.hostPath }}
