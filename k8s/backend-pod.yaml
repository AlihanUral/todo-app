apiVersion: v1
kind: Pod

metadata:
  name: todo-backend
  namespace: todo
  labels:
    app: todo-backend

spec:
  containers:
    - name: fastapi
      image: todo-app-backend:latest
      imagePullPolicy: IfNotPresent

      ports:
        - containerPort: 8000

      env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: todo-config
              key: DB_HOST

        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: todo-config
              key: DB_PORT

        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: todo-config
              key: DB_NAME

        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: todo-secret
              key: DB_USER

        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: todo-secret
              key: DB_PASSWORD