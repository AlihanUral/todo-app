apiVersion: apps/v1
kind: Deployment

metadata:
  name: todo-frontend
  namespace: todo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: todo-frontend

  template:
    metadata:
      labels:
        app: todo-frontend

    spec:
      containers:
        - name: nginx
          image: todo-app-frontend:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80

